descr: "Ignore malformed index timestamp candidates that compare after the requested range"
logfiles:
  kind: all_from_dir
  dir: ../../../input_logfiles/corrupted_index_timestamp
cur_year: 2026
cur_month: 9
args: [
  "--max-num-lines", "10",
  "--from", "2026-09-19-09:59",
  "--to",   "2026-09-19-10:03",
  "--awktime-month", "substr($0, 6, 2)",
  "--awktime-year", "substr($0, 1, 4)",
  "--awktime-day", "substr($0, 9, 2)",
  "--awktime-hhmm", "substr($0, 12, 5)",
  "--awktime-minute-key", "substr($0, 6, 11)",
]
