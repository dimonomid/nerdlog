descr: "Merge one clean and two corrupted logstreams without losing valid records"
current_time: "2026-09-19T12:00:00Z"
manager_params:
  config_log_streams:
    testhost-clean:
      log_files:
        kind: all_from_dir
        dir: logfiles_clean
      options:
        shell_init:
          - 'export TZ=UTC'
    testhost-corrupted-a:
      log_files:
        kind: all_from_dir
        dir: logfiles_corrupted_a
      options:
        shell_init:
          - 'export TZ=UTC'
    testhost-corrupted-b:
      log_files:
        kind: all_from_dir
        dir: logfiles_corrupted_b
      options:
        shell_init:
          - 'export TZ=UTC'
  initial_lstreams: "testhost-*"
  client_id: "core-test-runner"
test_steps:

  - descr: "merge valid records and attribute warnings to corrupted logstreams"
    query:
      params:
        max_num_lines: 10
        from: "2026-09-19T10:00:00Z"
        to: ""
        pattern: ""
        load_earlier: false
      want: want_log_resp_01_initial.txt
