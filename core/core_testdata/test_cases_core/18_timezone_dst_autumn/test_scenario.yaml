descr: "Repeated wall-clock hour with an autumn DST offset change"
current_time: "2025-10-27T00:00:00Z"
manager_params:
  config_log_streams:
    timezone-dst-autumn:
      log_files:
        kind: all_from_dir
        dir: ../../input_logfiles/timezone_dst_autumn_with_timezone
      options:
        shell_init:
          - 'export TZ=Europe/Sofia'
  initial_lstreams: "timezone-dst-autumn"
  client_id: "core-test-runner"
test_steps:
  - descr: "Keep all five messages from each hour when the 09:00 wall hour repeats with a new offset"
    query:
      params:
        max_num_lines: 20
        from: "2025-10-26T05:00:00Z"
        to: "2025-10-26T08:01:00Z"
        pattern: ""
        refresh_index: true
      want: want_log_resp_01_whole.txt
  - descr: "Use the index to return only the first 09:00 wall hour"
    query:
      params:
        max_num_lines: 20
        from: "2025-10-26T06:00:00Z"
        to: "2025-10-26T07:00:00Z"
        pattern: ""
        refresh_index: false
      want: want_log_resp_02_summer_hour.txt
  - descr: "Use the index to return only the repeated 09:00 wall hour"
    query:
      params:
        max_num_lines: 20
        from: "2025-10-26T07:00:00Z"
        to: "2025-10-26T08:00:00Z"
        pattern: ""
        refresh_index: false
      want: want_log_resp_03_winter_hour.txt
