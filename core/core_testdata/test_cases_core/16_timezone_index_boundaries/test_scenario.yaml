descr: "Timezone-aware index lookups at UTC-minute and single-line boundaries"
current_time: "2025-01-03T00:00:00Z"
manager_params:
  config_log_streams:
    timezone-index-boundaries:
      log_files:
        kind: all_from_dir
        dir: ../../input_logfiles/timezone_edge_cases
      options:
        shell_init:
          - 'export TZ=Etc/GMT+9'
  initial_lstreams: "timezone-index-boundaries"
  client_id: "core-test-runner"
test_steps:
  - descr: "Build the index while reading the whole file, including two offsets in one UTC minute"
    query:
      params:
        max_num_lines: 20
        from: "2025-01-01T23:00:00Z"
        to: "2025-01-02T10:00:00Z"
        pattern: ""
        refresh_index: true
      want: want_log_resp_01_whole.txt
  - descr: "Use the index to find both lines that share the exact 09:00 UTC minute"
    query:
      params:
        max_num_lines: 20
        from: "2025-01-02T09:00:00Z"
        to: "2025-01-02T09:01:00Z"
        pattern: ""
        refresh_index: false
      want: want_log_resp_02_collision.txt
  - descr: "Use the index to fetch exactly one line after a local-clock reversal"
    query:
      params:
        max_num_lines: 20
        from: "2025-01-02T04:20:00Z"
        to: "2025-01-02T04:21:00Z"
        pattern: ""
        refresh_index: false
      want: want_log_resp_03_single_line.txt
