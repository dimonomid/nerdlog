descr: "Server-local timestamps across the spring DST transition"
current_time: "2025-03-31T00:00:00Z"
manager_params:
  config_log_streams:
    timezone-dst-spring:
      log_files:
        kind: all_from_dir
        dir: ../../input_logfiles/timezone_dst_spring_no_timezone
      options:
        shell_init:
          - 'export TZ=Europe/Sofia'
  initial_lstreams: "timezone-dst-spring"
  client_id: "core-test-runner"
test_steps:
  - descr: "Apply Europe/Sofia DST rules when the local clock skips from 03:00 to 04:00"
    query:
      params:
        max_num_lines: 20
        from: "2025-03-29T23:00:00Z"
        to: "2025-03-30T02:00:00Z"
        pattern: ""
        refresh_index: true
      want: want_log_resp_01_whole.txt
  - descr: "Use the DST-aware index to find the lines after the skipped local hour"
    query:
      params:
        max_num_lines: 20
        from: "2025-03-30T01:00:00Z"
        to: "2025-03-30T01:02:00Z"
        pattern: ""
        refresh_index: false
      want: want_log_resp_02_after_transition.txt
