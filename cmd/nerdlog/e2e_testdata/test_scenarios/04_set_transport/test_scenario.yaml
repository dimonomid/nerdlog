descr: ""

scenario_params:
  config_log_streams:
    testhost-01:
      hostname: "127.0.0.1"
      log_files:
        kind: all_from_dir
        dir: ../../input_logfiles/small_mar
      options:
        shell_init:
          - 'export TZ=UTC'
  terminal_size:
    x: 110
    y: 30

test_steps:

  - descr: "start up"
    send_keys: [
        'NERDLOG_NO_CLIPBOARD=1 TZ=UTC USER=nerdlog-e2e-test NERDLOG_E2E_TEST_NOW=2025-06-01T00:00:00Z',
        ' ${NERDLOG_BINARY} --lstreams-config ${NERDLOG_LOGSTREAMS_CONFIG_FILE} --cmdhistory-file ${NERDLOG_TEST_OUTPUT_DIR}/cmd_history --queryhistory-file ${NERDLOG_TEST_OUTPUT_DIR}/query_history --set ''transport=custom:/bin/sh -c "/bin/sh -c sh"''',
        'C-m',
      ]
    want_screen_snapshot:
      snapshot: want_screen_01_initial.txt

  - descr: "execute query"
    send_keys: [
        'C-u',
        'Mar9 15:00 to Mar12 11:00',

        # Logstreams
        'Tab',
        'C-u',
        'testhost-01',

        # Pattern: leave empty
        'Tab',
        'C-u',

        # Select fields
        'Tab',
        'C-u',
        'time STICKY, lstream, message, hostname, pid, program',

        # Enter
        'C-m',
      ]
    want_screen_snapshot:
      snapshot: want_screen_02_executed_query.txt
      substitutions:
        - pattern:     'Query took: .{1,10}'
          replacement: 'Query took: XXXXXXXXXX'

  - descr: "get current value of transport"
    send_keys: [
        ':set transport?',
        'C-m',
      ]
    want_screen_snapshot:
      snapshot: want_screen_03_get_transport.txt
      substitutions:
        - pattern:     'Query took: .{1,10}'
          replacement: 'Query took: XXXXXXXXXX'

  - descr: "set a different transport"
    send_keys: [
        ':set transport=custom:/bin/sh -c sh',
        'C-m',
      ]
    want_screen_snapshot:
      snapshot: want_screen_04_get_transport.txt
      substitutions:
        - pattern:     'Query took: .{1,10}'
          replacement: 'Query took: XXXXXXXXXX'

  - descr: "get current value of transport again"
    # The previous command reconnects asynchronously, but its expected screen is
    # unchanged and can match before the reconnect has finished. Wait until focus
    # has settled before sending the next command.
    delay_before: "1s"
    send_keys: [
        ':set transport?',
        'C-m',
      ]
    want_screen_snapshot:
      snapshot: want_screen_05_get_transport.txt
      substitutions:
        - pattern:     'Query took: .{1,10}'
          replacement: 'Query took: XXXXXXXXXX'
